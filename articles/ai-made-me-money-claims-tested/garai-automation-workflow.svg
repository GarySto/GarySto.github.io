<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: Departments find issues, Supervisor root-causes them, Manager surfaces decisions, Dashboard shows yes or no options, Gary approves before anything runs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#ffffff"/>

<rect x="190" y="30" width="300" height="64" rx="10" fill="#eef1f6" stroke="#7387a6" stroke-width="1"/>
<text x="340" y="54" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1f3a5f">Departments</text>
<text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a5a72">Analyst, Recommender, Fill Analyst — find things</text>

<line x1="340" y1="94" x2="340" y2="134" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="134" width="300" height="64" rx="10" fill="#eef1f6" stroke="#7387a6" stroke-width="1"/>
<text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1f3a5f">Supervisor</text>
<text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a5a72">Root-causes it, so I'm never handed a raw problem</text>

<line x1="340" y1="198" x2="340" y2="238" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="238" width="300" height="64" rx="10" fill="#eef1f6" stroke="#7387a6" stroke-width="1"/>
<text x="340" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1f3a5f">Manager</text>
<text x="340" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a5a72">Talks to me, surfaces only what needs a decision</text>

<line x1="340" y1="302" x2="340" y2="342" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="342" width="300" height="64" rx="10" fill="#fbf1de" stroke="#c9852b" stroke-width="1"/>
<text x="340" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#6b4a11">Dashboard</text>
<text x="340" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a5c22">Plain yes, no or comments, nothing fancier</text>

<line x1="340" y1="406" x2="340" y2="446" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="446" width="300" height="64" rx="10" fill="#e3f2ec" stroke="#0f6e56" stroke-width="1"/>
<text x="340" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0a4a3a">Gary</text>
<text x="340" y="492" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c6e56">Approves before anything actually runs</text>

</svg>
