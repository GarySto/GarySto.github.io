/* Layout: one column of big, high-contrast panels; a verdict scoreboard first, then one test at a time with its controls above the chart. */
:root{
  --bg:#0c1118; --panel:#151d29; --panel2:#1c2737; --line:#34445c; --ink:#ffffff; --muted:#c8d3e4;

}
body{background:var(--bg);color:var(--ink);font:20px/1.5 var(--display);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:26px}
h1{font-size:2.2rem;margin:0;line-height:1.15;text-wrap:balance} h2{font-size:1.6rem;margin:0;text-wrap:balance}
h3{font-size:1.2rem;margin:0;color:var(--gold)}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tile:hover,.tile:focus-visible{border-color:var(--gold);outline:none}
.tile .name{font-weight:700;font-size:1.15rem}
.tile .num{font-family:var(--mono);font-size:1rem;color:var(--muted)}
.pill{display:inline-block;justify-self:start;font-weight:700;font-size:.95rem;padding:3px 12px;border-radius:999px;color:#000}
.pill.no{background:var(--bad)} .pill.np{background:var(--warn)} .pill.yes{background:var(--good)} .pill.watch{background:var(--strat)}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tabs button,.seg button,select{font:700 1.05rem var(--display);border-radius:10px;border:3px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 16px;cursor:pointer}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--gold);color:#000;border-color:var(--gold)}
button:focus-visible,select:focus-visible{outline:3px solid var(--strat);outline-offset:2px}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:end}
.ctl{display:grid;gap:6px} .ctl label,.ctl .lab{font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chart{position:relative;width:100%;height:420px} .chart.small{height:320px}
canvas{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:#000;border:2px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:1rem;white-space:nowrap;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:1rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:8px;vertical-align:middle;background:var(--c)}
.tw{overflow-x:auto} table{border-collapse:collapse;font-size:1.05rem;min-width:520px;width:100%}
th,td{border-bottom:2px solid var(--line);padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums} th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:.95rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
.means{background:var(--panel2);border-radius:12px;padding:14px 18px;max-width:75ch}
.means p{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.big{font-size:2rem;font-weight:700;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:1.05rem} .kv b{color:var(--muted);font-weight:700}
.note{color:var(--muted);font-size:.95rem}
@media (max-width:600px){ body{font-size:18px} .chart{height:320px} .panel{padding:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

(function () {

/* ---------------------------------------------------------------- tiny canvas charts (no library) */
function setup(holder) {

  return {c, g, tip, W: r.width, H: r.height};
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
function lineChart(holder, {labels, series, log = false, yFmt = v => v, tipFmt}) {
  const {c, g, tip, W, H} = setup(holder);
  const m = {l: 78, r: 16, t: 14, b: 40}, pw = W - m.l - m.r, ph = H - m.t - m.b;

  const f = log ? Math.log10 : v => v, F = log ? v => Math.pow(10, v) : v => v;
  const L = f(lo), Hh = f(hi), pad = (Hh - L) * .06, y0 = L - pad, y1 = Hh + pad;
  const X = i => m.l + (labels.length < 2 ? 0 : i / (labels.length - 1) * pw), Y = v => m.t + ph - (f(v) - y0) / (y1 - y0) * ph;
  g.font = "16px " + css("--display"); g.fillStyle = css("--muted"); g.strokeStyle = css("--line"); g.lineWidth = 1;
  let ticks = log ? (() => { const t = []; for (let e = Math.floor(y0); e <= Math.ceil(y1); e++) [1, 2, 5].forEach(k => { const v = k * Math.pow(10, e); if (f(v) >= y0 && f(v) <= y1) t.push(v); }); return t.length > 7 ? t.filter((_, i) => i % 2 === 0) : t; })()
                  : niceTicks(F(y0), F(y1));
  ticks.forEach(v => { const y = Y(v); g.beginPath(); g.moveTo(m.l, y); g.lineTo(W - m.r, y); g.stroke(); g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(yFmt(v), m.l - 10, y); });
  const step = Math.max(1, Math.ceil(labels.length / Math.max(2, Math.floor(pw / 110))));
  g.textAlign = "center"; g.textBaseline = "top";
  for (let i = 0; i < labels.length; i += step) g.fillText(String(labels[i]).slice(0, 7), X(i), H - m.b + 10);
  series.forEach(s => { g.strokeStyle = s.color; g.lineWidth = s.width || 3; g.setLineDash(s.dash || []); g.beginPath(); let on = false;

  g.setLineDash([]);
  series.forEach(s => { const i = s.data.length - 1, v = s.data[i]; if (v != null) { g.fillStyle = s.color; g.beginPath(); g.arc(X(i), Y(v), 5, 0, 7); g.fill(); } });
  const move = e => { const r = c.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((x - m.l) / pw * (labels.length - 1))));

function barChart(holder, {groups, series, yFmt = v => fmt(v) + "%", note}) {
  const {c, g, tip, W, H} = setup(holder);
  const m = {l: 70, r: 12, t: 16, b: 64}, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const vals = series.flatMap(s => s.data.filter(v => v != null)); let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo) * .12 || 1; lo -= lo < 0 ? pad : 0; hi += pad;
  const Y = v => m.t + ph - (v - lo) / (hi - lo) * ph;
  g.font = "16px " + css("--display"); g.strokeStyle = css("--line"); g.fillStyle = css("--muted"); g.lineWidth = 1;
  niceTicks(lo, hi).forEach(v => { const y = Y(v); g.beginPath(); g.moveTo(m.l, y); g.lineTo(W - m.r, y); g.stroke(); g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(yFmt(v), m.l - 8, y); });
  g.strokeStyle = css("--ink"); g.lineWidth = 2; g.beginPath(); g.moveTo(m.l, Y(0)); g.lineTo(W - m.r, Y(0)); g.stroke();

      const x = m.l + gi * gw + (gw - bw * series.length) / 2 + si * bw, y = Y(Math.max(0, v)), h = Math.abs(Y(v) - Y(0));

      g.fillStyle = css("--ink"); g.textAlign = "center"; g.textBaseline = v >= 0 ? "bottom" : "top"; g.font = "bold 15px " + css("--display");
      g.fillText(yFmt(v), x + bw / 2, v >= 0 ? y - 4 : y + h + 4); boxes.push({x, w: bw, gi, si, v}); });
    g.fillStyle = css("--muted"); g.font = "16px " + css("--display"); g.textAlign = "center"; g.textBaseline = "top";

    if (!b) { tip.hidden = true; return; } tip.hidden = false; tip.innerHTML = `<b>${groups[b.gi].replace("\n", " ")}</b><br>${series[b.si].name}: ${yFmt(b.v)}${note ? "<br>" + note(b.gi, b.si) : ""}`;
    tip.style.left = Math.min(W - tip.offsetWidth - 4, b.x + b.w) + "px"; tip.style.top = "10px"; };

}
function scatter(holder, {pts, hi, xl, yl}) {
  const {c, g, W, H} = setup(holder);

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);

  niceTicks(lo, hi2).forEach(v => { g.beginPath(); g.moveTo(m.l, Y(v)); g.lineTo(W - m.r, Y(v)); g.stroke(); g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(v + "%", m.l - 8, Y(v));
    g.textAlign = "center"; g.textBaseline = "top"; g.fillText(v + "%", X(v), H - m.b + 8); });
  g.strokeStyle = css("--ink"); g.lineWidth = 2; g.beginPath(); g.moveTo(X(0), m.t); g.lineTo(X(0), m.t + ph); g.moveTo(m.l, Y(0)); g.lineTo(W - m.r, Y(0)); g.stroke();
  g.strokeStyle = css("--gold"); g.setLineDash([8, 6]); g.beginPath(); g.moveTo(X(lo), Y(lo)); g.lineTo(X(hi2), Y(hi2)); g.stroke(); g.setLineDash([]);

  w.innerHTML = `<span class="lab" id="${id}-l">${label}</span><div class="seg" role="group" aria-labelledby="${id}-l"></div>`;

  options.forEach(([v, t]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.setAttribute("aria-pressed", String(v === value));
    b.onclick = () => { box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); onChange(v); }; box.appendChild(b); });
  return w;
}
function sel(id, label, options, value, onChange) {
  const w = document.createElement("div"); w.className = "ctl";
  w.innerHTML = `<label for="${id}">${label}</label><select id="${id}">${options.map(([v, t]) => `<option value="${v}"${v === value ? " selected" : ""}>${t}</option>`).join("")}</select>`;
  $("select", w).onchange = e => onChange(e.target.value); return w;
}
function panel(id, title, intro) {
  const p = document.createElement("section"); p.className = "panel"; p.id = "p-" + id; p.setAttribute("role", "tabpanel"); p.hidden = true;
  p.innerHTML = `<div><h2>${title}</h2><p class="sub">${intro}</p></div><div class="controls"></div>`; $("#panels").appendChild(p); return p;
}
const PANELS = [];
function addTab(id, name, build) { PANELS.push({id, name, build, built: false}); }
function show(id) {
  PANELS.forEach(p => { const el = $("#p-" + p.id); const on = p.id === id; if (el) el.hidden = !on; const t = $("#t-" + p.id); if (t) t.setAttribute("aria-selected", String(on));
    if (on && !p.built) { p.built = true; p.build(); } else if (on && p.redraw) p.redraw(); });
  try { localStorage.setItem("lab-tab", id); } catch (e) {}
}

/* ---------------------------------------------------------------- 1. Nasdaq trend */
addTab("nasdaq", "Nasdaq trend", () => {
  const N = DATA.nasdaq; const p = panel("nasdaq", "Trend-following on the Nasdaq 100 (1999 to 2026)",
    "Hold the Nasdaq 100 only while it is above its average price of the last N days, otherwise sit in cash. Compared with just holding it. Shows what £1,000 would have become.");
  const st = {lev: "1x", n: "200", per: "all", log: true};
  const chart = document.createElement("div"); chart.className = "chart";
  const leg = document.createElement("div"); leg.className = "legend";
  const tbl = document.createElement("div"); tbl.className = "tw";
  const means = document.createElement("div"); means.className = "means";
  const ctl = $(".controls", p);
  ctl.append(seg("nl", "Leverage", [["1x", "Normal"], ["3x", "3x leveraged"]], st.lev, v => { st.lev = v; draw(); }),
             seg("nn", "Average of the last", [["50", "50 days"], ["100", "100"], ["150", "150"], ["200", "200"], ["250", "250"]], st.n, v => { st.n = v; draw(); }),
             seg("np", "Period", [["all", "All"], ["1999-2009", "1999-2009"], ["2010-2017", "2010-2017"], ["2018-2026", "2018-2026"]], st.per, v => { st.per = v; draw(); }),
             seg("ns", "Scale", [["log", "Log"], ["lin", "Normal"]], "log", v => { st.log = v === "log"; draw(); }));
  p.append(leg, chart, tbl, means);
  function draw() {
    const [a, b] = st.per === "all" ? ["1999", "2026"] : st.per.split("-");
    const idx = N.dates.map((d, i) => [d, i]).filter(([d]) => d >= a && d <= b + "-12-31").map(x => x[1]);
    const hold = N.series["hold_" + st.lev], tr = N.series[`trend${st.n}_${st.lev}`];
    const base = i => idx.map(k => 1000 * hold[k] / hold[idx[0]]), base2 = idx.map(k => 1000 * tr[k] / tr[idx[0]]);
    const C1 = css("--bench"), C2 = css("--strat");
    leg.innerHTML = `<span style="--c:${C1}">Just holding${st.lev === "3x" ? " (3x)" : ""}</span><span style="--c:${C2}">Only above the ${st.n}-day average</span>`;
    lineChart(chart, {labels: idx.map(k => N.dates[k]), log: st.log, yFmt: money,
      series: [{name: "Just holding", color: C1, data: base(), width: 3}, {name: "Trend rule", color: C2, data: base2, width: 4}]});
    const s1 = N.stats["hold_" + st.lev][st.per], s2 = N.stats[`trend${st.n}_${st.lev}`][st.per];
    tbl.innerHTML = `<table><thead><tr><th>${st.per === "all" ? "1999-2026" : st.per}</th><th>Growth a year</th><th>Worst fall</th><th>Smoothness (Sharpe)</th></tr></thead><tbody>
      <tr><td>Just holding</td><td class="${cls(s1.cagr)}">${fmt(s1.cagr, 1)}%</td><td class="neg">${fmt(s1.maxdd, 1)}%</td><td>${fmt(s1.sharpe, 2, false)}</td></tr>
      <tr><td>Only above ${st.n}-day average</td><td class="${cls(s2.cagr)}">${fmt(s2.cagr, 1)}%</td><td class="neg">${fmt(s2.maxdd, 1)}%</td><td>${fmt(s2.sharpe, 2, false)}</td></tr></tbody></table>`;
    const better = s2.cagr > s1.cagr, safer = s2.maxdd > s1.maxdd;
    means.innerHTML = `<p><b>What it means:</b> ${better ? "The trend rule made more" : "Just holding made more"} in this period, and the trend rule's worst fall was ${safer ? "smaller" : "bigger"}. Across the whole period the rule works as crash insurance: it gives up some growth in rising markets and saves a lot in crashes.</p>`;
  }
  draw(); PANELS.find(x => x.id === "nasdaq").redraw = draw;
});

/* ---------------------------------------------------------------- 2. Momentum */
addTab("mom", "Momentum", () => {
  const M = DATA.momentum; const p = panel("mom", "Momentum: buy last year's biggest winners",
    "Each month, buy the stocks that rose most over the previous 6 or 12 months (skipping the latest month) and hold for a month. Compared with the average stock in the same group.");
  const st = {u: "big500", k: "25", look: "252", adj: false};
  const chart = document.createElement("div"); chart.className = "chart"; const leg = document.createElement("div"); leg.className = "legend";
  const bars = document.createElement("div"); bars.className = "chart small"; const tbl = document.createElement("div"); tbl.className = "tw";
  const means = document.createElement("div"); means.className = "means";
  const ctl = $(".controls", p);
  ctl.append(seg("mu", "Stocks", [["big500", "Biggest 500"], ["all", "All liquid"]], st.u, v => { st.u = v; draw(); }),
             seg("mk", "Buy the top", [["10", "10"], ["25", "25"], ["50", "50"]], st.k, v => { st.k = v; draw(); }),
             seg("ml", "Look back", [["126", "6 months"], ["252", "12 months"]], st.look, v => { st.look = v; draw(); }),
             seg("ma", "Adjust for how jumpy", [["no", "No"], ["yes", "Yes (biggest 500)"]], "no", v => { st.adj = v === "yes"; draw(); }));
  const h3 = document.createElement("h3"); h3.textContent = "Ahead of or behind the average stock, each year";
  p.append(leg, chart, h3, bars, tbl, means);
  function draw() {
    const key = `${st.u}_top${st.k}_${st.look}${st.adj && st.u === "big500" ? "_voladj" : ""}`, d = M[key];
    if (!d) { chart.textContent = "No data for this mix."; return; }
    let a = 1000, b = 1000; const A = [], B = []; d.mom.forEach((v, i) => { a *= 1 + v / 100; b *= 1 + d.bench[i] / 100; A.push(a); B.push(b); });
    const C1 = css("--bench"), C2 = css("--strat");
    leg.innerHTML = `<span style="--c:${C1}">Average stock (${st.u === "big500" ? "biggest 500" : "all liquid"})</span><span style="--c:${C2}">Momentum: top ${st.k}</span>`;
    lineChart(chart, {labels: d.months, log: true, yFmt: money, series: [{name: "Average stock", color: C1, data: B}, {name: "Momentum", color: C2, data: A, width: 4}]});
    const yrs = {}; d.months.forEach((m, i) => { const y = m.slice(0, 4); (yrs[y] = yrs[y] || {a: 1, b: 1}); yrs[y].a *= 1 + d.mom[i] / 100; yrs[y].b *= 1 + d.bench[i] / 100; });
    const ys = Object.keys(yrs).sort(); const ex = ys.map(y => +((yrs[y].a - yrs[y].b) * 100).toFixed(1));
    barChart(bars, {groups: ys.map(y => "'" + y.slice(2)), series: [{name: "Ahead / behind", data: ex, colorFor: v => v >= 0 ? css("--good") : css("--bad")}], yFmt: v => fmt(v, 0) + "%"});
    const per = (lo, hi) => { const ix = d.months.map((m, i) => [m, i]).filter(([m]) => m >= lo && m <= hi).map(x => x[1]);
      const g = arr => (ix.reduce((t, i) => t * (1 + arr[i] / 100), 1) ** (12 / ix.length) - 1) * 100; return [g(d.mom), g(d.bench), ix.reduce((t, i) => t + d.mom[i] - d.bench[i], 0) / ix.length]; };
    const r1 = per("2011", "2018-12"), r2 = per("2019", "2026-12");
    tbl.innerHTML = `<table><thead><tr><th>Period</th><th>Momentum a year</th><th>Average stock a year</th><th>Ahead per month</th></tr></thead><tbody>
      <tr><td>2011-2018</td><td class="${cls(r1[0])}">${fmt(r1[0], 1)}%</td><td>${fmt(r1[1], 1)}%</td><td class="${cls(r1[2])}">${fmt(r1[2])}%</td></tr>
      <tr><td>2019-2026</td><td class="${cls(r2[0])}">${fmt(r2[0], 1)}%</td><td>${fmt(r2[1], 1)}%</td><td class="${cls(r2[2])}">${fmt(r2[2])}%</td></tr></tbody></table>`;
    means.innerHTML = `<p><b>What it means:</b> in the biggest stocks, momentum lost slightly from 2011 to 2018 and beat the average from 2019 to 2026. Among all liquid stocks it mostly lost. That flip between periods is why it is "not proven": it is the best candidate so far for a forward Shadow Book, not for money.</p>`;
  }
  draw(); PANELS.find(x => x.id === "mom").redraw = draw;
});

addTab("pm", "Premarket Game", () => {
